<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111c35"></stop>
      <stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"></stop>
      <stop offset="100%" stop-color="#0891b2"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"></rect>

  <!-- Circuit decoration -->
  <g stroke="#0891b2" stroke-width="2" fill="none" opacity=".8">
    <path d="M12 25 H25 V15 H35"></path>
    <path d="M88 75 H75 V85 H65"></path>
    <circle cx="35" cy="15" r="3" fill="#22d3ee"></circle>
    <circle cx="65" cy="85" r="3" fill="#22d3ee"></circle>
  </g>

  <!-- Monogram -->
  <text x="50" y="62" font-family="Arial, sans-serif" font-size="39" font-weight="900" text-anchor="middle" fill="url(#cyan)" filter="url(#glow)">EM</text>

  <!-- Bottom accent -->
  <rect x="29" y="75" width="42" height="3" rx="2" fill="#22d3ee"></rect>
</svg>